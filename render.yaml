services:
  - type: web
    name: techcodie-editor-api
    runtime: node
    plan: free
    # NODE_ENV=production below makes npm default omit=dev, which silently
    # skips typescript/@types/node and breaks this build (reproduced and
    # confirmed in a clean Node 22.12.0 Linux container). --include=dev
    # forces devDependencies in regardless of NODE_ENV; only the compiled
    # dist-server output runs at runtime, so this has no effect there.
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GROQ_TIMEOUT_MS
        value: "30000"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
