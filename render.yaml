services:
  - type: web
    name: techcodie-editor-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_URL
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GROQ_TIMEOUT_MS
        value: "30000"
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
